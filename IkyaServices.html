<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Poppins', sans-serif; padding: 20px; }
    h2 { color: #352d82; font-weight: 700; margin-bottom: 30px; }

    .form-section { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 40px; }
    .form-section label { font-weight: 500; }
    .form-section input, .form-section textarea { border-radius: 8px; border: 1px solid #ced4da; }

    .btn-primary { background-color: #352d82; border-color: #352d82; }
    .btn-primary:hover { background-color: #261f63; border-color: #261f63; }
    .btn-secondary { background-color: #e4322b; border-color: #e4322b; }
    .btn-secondary:hover { background-color: #b22922; border-color: #b22922; }

    .table-responsive { box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 12px; overflow: hidden; }
    .table thead { background-color: #352d82; color: #fff; }
    .table tbody tr:hover { background-color: rgba(53, 45, 130, 0.05); }
    .preview-img { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; }

    .btn-group .btn { border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Manage Services</h2>

  <div class="form-section">
    <form id="serviceForm" enctype="multipart/form-data">
      <input type="hidden" id="serviceId">

      <div class="row mb-3">
        <div class="col-md-6 mb-3">
          <label class="form-label">Service Name</label>
          <input type="text" class="form-control" id="serviceName" placeholder="Enter service name" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Image</label>
          <input type="file" class="form-control" id="imageFile" accept="image/*">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" id="description" rows="4" placeholder="Enter service description" required></textarea>
      </div>


      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="popularService" value="1">
        <label class="form-check-label" for="popularService">Popular Service</label>
    </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Service</button>
        <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </form>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle bg-white">
      <thead>
        <tr>
          <th scope="col">Image</th>
          <th scope="col">Service Name</th>
          <th scope="col">Description</th>
          <th scope="col">Popular</th>
          <th scope="col">Created On</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="servicesTable"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8081/Services";

document.addEventListener("DOMContentLoaded", loadServices);

async function loadServices() {
  try {
    const res = await fetch(API_BASE + "/all");
    const data = await res.json();
    const table = document.getElementById("servicesTable");
    table.innerHTML = "";

    data.forEach(s => {
      const desc = s.description.length > 80 ? s.description.substring(0, 80) + '...' : s.description;
      table.innerHTML += `
        <tr>
          <td><img src="http://localhost:8081${s.image}" class="preview-img" alt=""></td>
          <td>${s.serviceName}</td>
          <td title="${s.description}">${desc}</td>
          <td>${s.popularService == 1 ? '✅' : ''}</td>
          <td>${s.createdOn ? new Date(s.createdOn).toLocaleDateString() : ''}</td>
          <td>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-warning" onclick="editService(${s.id}, '${s.serviceName}', \`${s.description}\`, ${s.popularService})">Edit</button>
              <button class="btn btn-danger" onclick="deleteService(${s.id})">Delete</button>
            </div>
          </td>
        </tr>
      `;
    });
  } catch (err) {
    console.error("Error loading services:", err);
  }
}

// Form submit
document.getElementById("serviceForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const id = document.getElementById("serviceId").value;
  const name = document.getElementById("serviceName").value;
  const desc = document.getElementById("description").value;
  const popular = document.getElementById("popularService").checked ? 1 : 0;
  const fileInput = document.getElementById("imageFile").files[0];

  const formData = new FormData();
  formData.append("serviceName", name);
  formData.append("description", desc);
  formData.append("popularService", popular);
  if (fileInput) formData.append("imageFile", fileInput);

  try {
    let url = API_BASE + "/add";
    let method = "POST";
    if (id) { url = API_BASE + "/update/" + id; method = "PUT"; }

    await fetch(url, { method, body: formData });
    alert(id ? "Service updated!" : "Service added!");
    resetForm();
    loadServices();
  } catch (err) {
    console.error("Error saving service:", err);
  }
});

function editService(id, name, desc, popular) {
  document.getElementById("serviceId").value = id;
  document.getElementById("serviceName").value = name;
  document.getElementById("description").value = desc;
  document.getElementById("popularService").checked = popular == 1;
  document.getElementById("saveBtn").innerText = "Update Service";
}

async function deleteService(id) {
  if (confirm("Are you sure you want to delete this service?")) {
    try {
      await fetch(API_BASE + "/delete/" + id, { method: "DELETE" });
      alert("Service deleted!");
      loadServices();
    } catch (err) {
      console.error("Error deleting service:", err);
    }
  }
}

function resetForm() {
  document.getElementById("serviceId").value = "";
  document.getElementById("serviceForm").reset();
  document.getElementById("saveBtn").innerText = "Save Service";
}

document.getElementById("resetBtn").addEventListener("click", resetForm);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
