<!-- Custom JS to load Departments -->

<!-- Bootstrap JS bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

const API_BASE = "https://ikya-backend-3.onrender.com/Specialities";

document.addEventListener("DOMContentLoaded", () => {
    loadDepartments();
});

async function loadDepartments() {
    try {
        const res = await fetch(`${API_BASE}/all`);
        if (!res.ok) throw new Error("Failed to fetch departments");

        const departments = await res.json();
        const menu = document.getElementById("departmentMenu");
        menu.innerHTML = "";

        if (!departments || departments.length === 0) {
            menu.innerHTML = `<li><span class="dropdown-item text-muted">No Departments Found</span></li>`;
            return;
        }

        departments.forEach(dept => {
            menu.innerHTML += `
                <li>
                    <a class="dropdown-item" href="department.html?id=${dept.id}">
                        ${dept.title}
                    </a>
                </li>
            `;
        });

    } catch (err) {
        console.error("Error loading departments:", err);
        document.getElementById("departmentMenu").innerHTML = `<li><span class="dropdown-item text-danger">Error loading departments</span></li>`;
    }
}
</script>

</body>
