<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Why Choose Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background-color: #f8f9fa; }
    .form-section { margin-bottom: 40px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
    .preview-icon { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    .table th, .table td { vertical-align: middle; }
    .btn-group-sm .btn { padding: 0.25rem 0.5rem; font-size: 0.8rem; }
    h2 { font-weight: 700; color: #352d82; margin-bottom: 30px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Manage Why Choose Us</h2>

  <!-- Form Section -->
  <div class="form-section">
    <form id="chooseUsForm" enctype="multipart/form-data">
      <input type="hidden" id="serviceId">

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Service Name</label>
          <input type="text" class="form-control" id="serviceName" placeholder="Enter service name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Icon</label>
          <input type="file" class="form-control" id="iconFile" accept="image/*">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" id="description" rows="3" placeholder="Enter description" required></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Service</button>
        <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </form>
  </div>

  <!-- Services Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle bg-white shadow-sm rounded">
      <thead class="table-dark">
        <tr>
          <th scope="col">Icon</th>
          <th scope="col">Service Name</th>
          <th scope="col">Description</th>
          <th scope="col">Created On</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="servicesTable">
        <!-- Dynamic rows -->
      </tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = "https://ikya-backend-3.onrender.com/WhyChooseUs";

document.addEventListener("DOMContentLoaded", loadServices);

async function loadServices() {
  try {
    const res = await fetch(API_BASE + "/all");
    const data = await res.json();
    const table = document.getElementById("servicesTable");
    table.innerHTML = "";

    data.forEach(s => {
      const desc = s.description.length > 80 ? s.description.substring(0, 80) + '...' : s.description;
      table.innerHTML += `
        <tr>
          <td>${s.icon ? `<img src="https://ikya-backend-3.onrender.com${s.icon}" class="preview-icon" alt="${s.serviceName}">` : ''}</td>
          <td>${s.serviceName}</td>
          <td title="${s.description}">${desc}</td>
          <td>${s.createdOn ? new Date(s.createdOn).toLocaleDateString() : ''}</td>
          <td>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-warning" onclick="editService(${s.id}, '${s.serviceName}', \`${s.description}\`)">Edit</button>
              <button class="btn btn-danger" onclick="deleteService(${s.id})">Delete</button>
            </div>
          </td>
        </tr>
      `;
    });
  } catch (err) {
    console.error("Error loading services:", err);
  }
}

document.getElementById("chooseUsForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const id = document.getElementById("serviceId").value;
  const name = document.getElementById("serviceName").value;
  const desc = document.getElementById("description").value;
  const fileInput = document.getElementById("iconFile").files[0];

  const formData = new FormData();
  formData.append("serviceName", name);
  formData.append("description", desc);
  if (fileInput) formData.append("iconFile", fileInput);

  try {
    let url = API_BASE + "/add";
    let method = "POST";
    if (id) { url = API_BASE + "/update/" + id; method = "PUT"; }

    await fetch(url, { method, body: formData });
    alert(id ? "Service updated!" : "Service added!");
    resetForm();
    loadServices();
  } catch (err) {
    console.error("Error saving service:", err);
  }
});

function editService(id, name, desc) {
  document.getElementById("serviceId").value = id;
  document.getElementById("serviceName").value = name;
  document.getElementById("description").value = desc;
  document.getElementById("saveBtn").innerText = "Update Service";
}

async function deleteService(id) {
  if (confirm("Are you sure you want to delete this service?")) {
    try {
      await fetch(API_BASE + "/delete/" + id, { method: "DELETE" });
      alert("Service deleted!");
      loadServices();
    } catch (err) {
      console.error("Error deleting service:", err);
    }
  }
}

document.getElementById("resetBtn").addEventListener("click", resetForm);
function resetForm() {
  document.getElementById("serviceId").value = "";
  document.getElementById("chooseUsForm").reset();
  document.getElementById("saveBtn").innerText = "Save Service";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
