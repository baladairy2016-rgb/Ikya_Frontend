<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Active Appointments</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
      color: #1f2937;
    }

    .table-container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow-x: auto;
      max-width: 1200px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 900px;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #007bff;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: #f1f5f9;
    }

    td button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.2s, background 0.2s;
    }

    td button:hover {
      transform: translateY(-2px);
    }

    .delete-btn {
      background: #dc3545;
      color: #fff;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      color: #fff;
      text-transform: uppercase;
    }

    .status-active { background: #28a745; }
    .status-inactive { background: #6c757d; }
    .status-pending { background: #ffc107; color: #000; }

    @media(max-width: 768px) {
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<h1>Active Appointments</h1>

<div class="table-container">
  <table id="appointmentsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Patient</th>
        <th>Date</th>
        <th>Time</th>
        <th>Doctor</th>
        <th>Mode</th>
        <th>Reason</th>
        <th>Status</th>
        <th>Payment</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const apiBase = "https://ikya-backend-3.onrender.com/api/appointments";

// Load Active Appointments
async function loadAppointments() {
  try {
    const res = await fetch(apiBase);
    const data = await res.json();

    const tbody = document.querySelector("#appointmentsTable tbody");
    tbody.innerHTML = "";

    const activeAppointments = data.filter(a => a.status === "ACTIVE");

    activeAppointments.forEach(a => {
      const statusClass = a.status === "ACTIVE" ? "status-active" :
                          a.status === "INACTIVE" ? "status-inactive" :
                          "status-pending";

      const paymentText = a.paymentStatus ? `${a.paymentStatus} (${a.paymentReference || ""})` : "N/A";

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${a.appointmentId}</td>
        <td>${a.patientId}</td>
        <td>${a.appointmentDate}</td>
        <td>${a.appointmentTime}</td>
        <td>${a.doctorId}</td>
        <td>${a.mode}</td>
        <td>${a.reason || ""}</td>
        <td><span class="status-badge ${statusClass}">${a.status}</span></td>
        <td>${paymentText}</td>
        <td>
          <button class="delete-btn" onclick="deleteAppointment(${a.appointmentId})">
            <i class="fa fa-trash"></i> Delete
          </button>
        </td>
      `;
      tbody.appendChild(row);
    });

  } catch (err) {
    console.error("Error loading appointments:", err);
    alert("Failed to load appointments.");
  }
}

// Delete appointment
async function deleteAppointment(id) {
  if (!confirm("Are you sure you want to delete this appointment?")) return;
  try {
    const res = await fetch(`${apiBase}/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("Delete failed");
    alert("Appointment deleted successfully!");
    loadAppointments();
  } catch (err) {
    console.error(err);
    alert("Failed to delete appointment.");
  }
}

loadAppointments();
</script>

</body>
</html>
