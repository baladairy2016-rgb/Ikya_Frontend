<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="container py-4">

  <h2 class="mb-4">Manage Blogs</h2>

  <!-- ✅ Blog Form -->
  <form id="blogForm" class="row g-3 mb-5">
    <input type="hidden" id="blogId">

    <div class="col-md-6">
      <label class="form-label">Title</label>
      <input type="text" id="title" class="form-control" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Description</label>
      <textarea id="description" class="form-control" required></textarea>
    </div>

    <div class="col-md-6">
      <label class="form-label">Image</label>
      <input type="file" id="imageFile" class="form-control">
    </div>

    <div class="col-md-6">
      <label class="form-label">Icon</label>
      <input type="file" id="iconFile" class="form-control">
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Save Blog</button>
      <button type="reset" class="btn btn-secondary" onclick="resetForm()">Reset</button>
    </div>
  </form>

  <!-- ✅ Blogs Table -->
  <h4>All Blogs</h4>
  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>#</th>
        <th>Icon</th>
        <th>Image</th>
        <th>Title</th>
        <th>Description</th>
        <th>Created By</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="blogsTable"></tbody>
  </table>

  <script>
    const API_BASE = "http://localhost:8081/Blogs";

    // ✅ Load all blogs on page load
    document.addEventListener("DOMContentLoaded", loadBlogs);

    // ✅ Handle Add/Update Blog
    document.getElementById("blogForm").addEventListener("submit", async function(e){
      e.preventDefault();

      let id = document.getElementById("blogId").value;
      let title = document.getElementById("title").value;
      let description = document.getElementById("description").value;
      let imageFile = document.getElementById("imageFile").files[0];
      let iconFile = document.getElementById("iconFile").files[0];

      let formData = new FormData();
      formData.append("title", title);
      formData.append("description", description);
      if(imageFile) formData.append("imageFile", imageFile);
      if(iconFile) formData.append("iconFile", iconFile);

      try {
        if(id){ 
          // Update
          await axios.put(`${API_BASE}/update/${id}`, formData, {
            headers: { "Content-Type": "multipart/form-data" }
          });
          alert("Blog updated successfully!");
        } else {
          // Add
          await axios.post(`${API_BASE}/add`, formData, {
            headers: { "Content-Type": "multipart/form-data" }
          });
          alert("Blog added successfully!");
        }
        resetForm();
        loadBlogs();
      } catch(err){
        console.error(err);
        alert("Error saving blog");
      }
    });

    // ✅ Load all blogs
    async function loadBlogs(){
      try {
        let res = await axios.get(`${API_BASE}/all`);
        let blogs = res.data;
        let rows = "";
        blogs.forEach((b, i) => {
          rows += `
            <tr>
              <td>${i+1}</td>
              <td>${b.icon ? `<img src="http://localhost:8081${b.icon}" width="40">` : ''}</td>
              <td>${b.image ? `<img src="http://localhost:8081${b.image}" width="70">` : ''}</td>
              <td>${b.title}</td>
              <td>${b.description}</td>
              <td>${b.createdBy}</td>
              <td>
                <button class="btn btn-sm btn-warning" onclick='editBlog(${JSON.stringify(b)})'>Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteBlog(${b.id})">Delete</button>
              </td>
            </tr>
          `;
        });
        document.getElementById("blogsTable").innerHTML = rows;
      } catch(err){
        console.error(err);
      }
    }

    // ✅ Edit Blog (load values into form)
    function editBlog(blog){
      document.getElementById("blogId").value = blog.id;
      document.getElementById("title").value = blog.title;
      document.getElementById("description").value = blog.description;
    }

    // ✅ Delete Blog
    async function deleteBlog(id){
      if(confirm("Are you sure you want to delete this blog?")){
        try {
          await axios.delete(`${API_BASE}/delete/${id}`);
          alert("Blog deleted successfully!");
          loadBlogs();
        } catch(err){
          console.error(err);
          alert("Error deleting blog");
        }
      }
    }

    // ✅ Reset form
    function resetForm(){
      document.getElementById("blogId").value = "";
      document.getElementById("blogForm").reset();
    }
  </script>

</body>
</html>
